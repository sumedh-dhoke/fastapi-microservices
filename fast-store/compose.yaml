services:
  # jaeger UI  for openntelemetry
  jaeger:
    image: jaegertracing/all-in-one:1.41
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger web UI port
      - "4317:4317" # Jaeger collector port
   
  # Message Broker Service: RabbitMQ
  rabbitmq: 
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # RabbitMQ messaging port
      - "15672:15672" # RabbitMQ management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass123
      RABBITMQ_ERLANG_COOKIE: 'R4bb1tC00k13ChangeMe!'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5  

  # API Gateway and Reverse Proxy: Traefik    
  traefik:
    image: traefik:v3.7.13
    command:
      - "--api.insecure=true" # Enable the Traefik dashboard. Should be false in production for security reasons.
      - "--providers.docker=true" # Enable Docker provider
      - "--providers.docker.exposedbydefault=false" # Only expose containers with explicit labels 
      - "--entrypoints.web.address=:80" # Define the entry point for HTTP traffic
    ports:
      - "8081:80" # Internet traffic on port 8081 which is internally routed to Traefik's entry point on port 80 . Also swagger docs on this port
      - "8080:8080" # Traefik dashboard on port 8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  # User Service: Handles user-related operations
  user-service:
    build:
      context: .
      dockerfile: services/user-service/dockerfile
    labels: # Traefik labels for routing and service configuration
      - "traefik.enable=true" # Enable Traefik for this service .This allows Traefik to route traffic to the user-service container.
      - "traefik.http.routers.user-service.entrypoints=web" # Specify the entry point for the user-service router
      - "traefik.http.routers.user-service.rule=PathPrefix(`/users`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)" # Define the routing rule for the user-service
      - "traefik.http.services.user-service.loadbalancer.server.port=8001" # Specify the internal port of the user-service container
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/user_db
    depends_on:
      - db
      - product-service
      - jaeger
      - order-service
      - inventory-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3  
      start_period: 5s

  #DB Service: PostgreSQL database for user-service
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   

  # Product Service: Handles product-related operations    
  product-service:
    build:
      context: .
      dockerfile: services/product-service/dockerfile

  # Order Service: Handles order-related operations    
  order-service:
    build:
      context: .
      dockerfile: services/order-service/dockerfile
    ports:
      - "8002:8000" # Expose the order-service externally on port 8002. This is only for testing purposes. In production, you would typically route traffic through Traefik. 
    depends_on:
      rabbitmq:
        condition: service_healthy
      
  
            
          
  
  # Inventory Service: Handles inventory-related operations    
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/dockerfile
    environment:
      - PYTHONUNBUFFERED=1  # Ensure that Python output is sent straight to the terminal (e.g., for logging purposes)
    ports:
      - "8003:8000" # Expose the inventory-service externally on port 8003. This is only for testing purposes. In production, you would typically route traffic through Traefik. 
    depends_on:
      rabbitmq:
        condition: service_healthy  


  # loki for log aggregation
  loki:
    image: grafana/loki:2.8.2
    container_name: loki_microservice
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki API port
    
  # promtail for log collection 
  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail_microservice
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./shared_utils/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki

  # grafana
  grafana:
    image: grafana/grafana:10.0.1
    container_name: grafana_microservice
    ports:
      - "3001:3000" # Grafana web UI port
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false # Disable user sign-up for security reasons
    depends_on:
      - loki

# Define a named volume for PostgreSQL data persistence
volumes:
  postgres_data:
  rabbitmq_data:
