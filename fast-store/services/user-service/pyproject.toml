[project]
name = "user-service"
version = "0.1.0"
description = "User Service handles user related tasks and authentication."
readme = "README.md"
authors = [
    { name = "Sumedh-Lenovo", email = "sumedh85@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.42",
]

[project.scripts]
user-service = "user_service:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
